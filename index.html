<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Rache HVA - 100% Complete Britannica Review Deck</title>
    <style>
        :root {
            --primary: #2b6cb0;
            --primary-light: #ebf8ff;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --success: #48bb78;
            --error: #f56565;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            font-size: 22px;
            text-align: center;
            margin: 0 0 5px 0;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #718096;
            margin-bottom: 15px;
        }
        .category-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: #edf2f7;
            border: 1px solid var(--border);
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .flashcard-scene {
            width: 100%;
            height: 290px;
            perspective: 800px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 10px;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 2px solid var(--border);
            text-align: center;
        }
        .card-front {
            background: #ffffff;
        }
        .card-front .tag {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #e2e8f0;
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 12px;
            color: #4a5568;
        }
        .card-front h2 {
            font-size: 24px;
            color: var(--primary);
            margin: 0 0 10px 0;
        }
        .card-front p {
            font-size: 14px;
            color: #4a5568;
            margin: 0;
            line-height: 1.5;
        }
        .card-front .hint {
            font-size: 11px;
            color: #cbd5e0;
            margin-top: 15px;
            font-style: italic;
        }
        .card-back {
            background: var(--primary-light);
            color: #2b6cb0;
            transform: rotateY(180deg);
            border-color: #bee3f8;
        }
        .card-back h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 8px 0;
            color: #4a5568;
        }
        .card-back p {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-correct { background-color: var(--success); color: white; }
        .btn-wrong { background-color: var(--error); color: white; }
        .footer-stats {
            font-size: 13px;
            color: #4a5568;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="deck-wrapper">
    <h1>HVA Diagnostic Classification Deck</h1>
    <div class="subtitle">Complete Review Deck (88 Terms Mapped from Source Website)</div>

    <div class="category-selector">
        <button class="tab-btn active" onclick="switchCategory('ALL', this)">All (88)</button>
        <button class="tab-btn" onclick="switchCategory('CHEMICAL', this)">Chemical/Cellular (28)</button>
        <button class="tab-btn" onclick="switchCategory('IMAGING', this)">Imaging (23)</button>
        <button class="tab-btn" onclick="switchCategory('GENETIC', this)">Genetics (3)</button>
        <button class="tab-btn" onclick="switchCategory('MEASURE', this)">Measurement (9)</button>
        <button class="tab-btn" onclick="switchCategory('EXAM', this)">Physical Exam (25)</button>
    </div>

    <div id="deck-progress" style="font-size: 12px; color:#718096; text-align:right; margin-bottom:5px;">Card 1 of 88</div>

    <div class="flashcard-scene" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="tag" id="card-tag">Loading...</div>
                <h2 id="term-text">Loading...</h2>
                <p id="desc-text">Loading items...</p>
                <div class="hint">Tap card to verify medical classification</div>
            </div>
            <div class="card-face card-back">
                <h3>Hello Rache Chart Category:</h3>
                <p id="category-text">Loading...</p>
            </div>
        </div>
    </div>

    <div class="controls" id="action-controls">
        <button class="btn btn-wrong" onclick="logAnswer(false)">Mark Incorrect ✗</button>
        <button class="btn btn-correct" onclick="logAnswer(true)">Mark Correct ✓</button>
    </div>

    <div class="footer-stats">
        <div>Mastered: <strong id="score-count">0</strong></div>
        <div>Deck Remaining: <strong id="remaining-count">88</strong></div>
    </div>
</div>
